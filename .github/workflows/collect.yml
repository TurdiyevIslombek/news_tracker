name: collect

# The "brain": every 6 hours fetch → dedupe → rank → summarize → publish JSON.
# Runs in the cloud, so the feed keeps going while your laptop is off.
on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC (off the hour = less queueing)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["collector/**", ".github/workflows/collect.yml"]

# Never let two runs write the same day at once. Queue instead of cancelling.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write   # commit docs/ + state/
  pages: write      # deploy GitHub Pages
  id-token: write   # required by deploy-pages
  actions: write    # keepalive: re-enable this workflow so GitHub's 60-day rule never disables it

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # normal runs take < 10 min; headroom for a rare rebuild
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # LLM keys are needed by both Collect and the conflict-retry in Commit data.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub search API (higher rate limit)
    steps:
      # Always build on the newest data, not the commit that triggered the run
      # (a code push can predate the previous run's data commit).
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collector/requirements*.txt

      - name: Install
        run: pip install -r collector/requirements-dev.txt

      - name: Test
        run: python -m pytest collector/tests -q

      - name: Collect
        run: python -m collector run

      # Generated JSON can't be merged by git. If main moved, start over from the
      # new data and re-run (cached summaries make the re-run cheap).
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add docs state
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            echo "main moved; rebuilding on the latest data (attempt $attempt)"
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m collector run
          done
          exit 1

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy_first
        uses: actions/deploy-pages@v5
        continue-on-error: true    # transient "artifact not found" errors happen; retry once
      - name: Wait before retrying deploy
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deploy
        run: echo "page_url=${URL_FIRST:-$URL_RETRY}" >> "$GITHUB_OUTPUT"
        env:
          URL_FIRST: ${{ steps.deploy_first.outputs.page_url }}
          URL_RETRY: ${{ steps.deploy_retry.outputs.page_url }}

      # Scheduled workflows in public repos are disabled after 60 days without
      # activity. Re-enabling is a no-op while enabled and resets that clock.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable" || true
