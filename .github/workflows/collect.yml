name: collect

# The "brain": every 6 hours fetch → dedupe → rank → summarize → publish JSON.
# Runs in the cloud, so the feed keeps going while your laptop is off.
on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC (off the hour = less queueing)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["collector/**", ".github/workflows/collect.yml"]

# Never let two runs write the same day at once. Queue instead of cancelling.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write   # commit docs/ + state/
  pages: write      # deploy GitHub Pages
  id-token: write   # required by deploy-pages
  models: read      # GitHub Models (free LLM fallback via GITHUB_TOKEN)
  actions: write    # keepalive: re-enable this workflow so GitHub's 60-day rule never disables it

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collector/requirements*.txt

      - name: Install
        run: pip install -r collector/requirements-dev.txt

      - name: Test
        run: python -m pytest collector/tests -q

      - name: Collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m collector run

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q
          done
          exit 1

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5

      # Scheduled workflows in public repos are disabled after 60 days without
      # activity. Re-enabling is a no-op while enabled and resets that clock.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable" || true
