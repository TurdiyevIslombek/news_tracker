# AI Pulse collector configuration. Everything tunable lives here.

http:
  timeout_seconds: 30
  user_agent: "AIPulse/0.1 (+https://github.com/TurdiyevIslombek/news_tracker)"

output:
  docs_dir: docs            # published by GitHub Pages
  state_dir: state          # run state + caches (committed, not published)
  top_n: 15                 # summarized items per day
  more_n: 40                # lighter "more" items per day
  first_run_lookback_hours: 24
  pool_days: 7              # recent days that can still be re-ranked / re-summarized
  top_caps:                 # max per source group in the top list (rest go to "more")
    papers: 9               # arxiv + hf_papers
    blog: 6
    hn: 5
    github: 3

sources:
  arxiv:
    enabled: true
    categories: [cs.LG, cs.CL, cs.AI, cs.CV, stat.ML]
    page_size: 200
    max_results: 600        # cap per run; arXiv gets ~1k+/day across these
    window_days: 4          # API lags submission by 1-3 days (announcement schedule)
    delay_seconds: 3        # arXiv API etiquette: >= 3s between requests
  hf_papers:
    enabled: true
    url: https://huggingface.co/api/daily_papers
  blogs:
    enabled: true
    lookback_hours: 48
    # Every URL checked 2026-11-23. Anthropic publishes no RSS feed (404), so it's
    # not here; Meta's ai.meta.com has none either, so Meta Engineering's AI feed is used.
    feeds:
      - {name: openai,          lab: OpenAI,           url: "https://openai.com/news/rss.xml"}
      - {name: deepmind,        lab: Google DeepMind,  url: "https://deepmind.google/blog/rss.xml", category_hint: Research}
      - {name: google_research, lab: Google Research,  url: "https://research.google/blog/rss/", category_hint: Research}
      - {name: meta,            lab: Meta,             url: "https://engineering.fb.com/category/ai-research/feed/", category_hint: Research}
      - {name: mistral,         lab: Mistral,          url: "https://mistral.ai/rss.xml"}
      - {name: huggingface,     lab: Hugging Face,     url: "https://huggingface.co/blog/feed.xml"}
      - {name: nvidia,          lab: NVIDIA,           url: "https://developer.nvidia.com/blog/category/generative-ai/feed/"}
  hn:
    enabled: true
    min_points: 60
    window_hours: 48        # stories keep gaining points; signals refresh on re-reads
  github:
    enabled: true
    topics: [llm, large-language-models, machine-learning, deep-learning, generative-ai, ai-agents, ai]
    created_within_days: 7
    min_stars: 100
    max_checked: 20         # candidates vetted (2 API calls each)
    max_repos: 10
    min_owner_age_days: 90  # star-farming filter
    max_watcher_ratio: 0.15 # watchers/stars; organic repos are usually < 0.05

ranking:
  # score = hf * log1p(upvotes) + hn * log1p(points) + gh * log1p(stars)
  #       + lab_bonus (if from a major lab) + multi_source * (extra sources)
  #       + recency * exp(-age_hours / recency_half_life_hours)
  weights:
    hf_upvotes: 1.0
    hn_points: 0.8
    github_stars: 0.6
    lab_bonus: 1.0          # paper / repo from an org on the `labs` list
    lab_blog_bonus: 3.0     # official lab blog post (no upvotes to rank by, so it needs more)
    multi_source: 1.0
    recency: 1.0
  recency_half_life_hours: 36
  # Orgs that count as a "major lab" (HF paper organization or GitHub owner; blog
  # feeds above always count). Case-insensitive.
  labs: [openai, anthropic, google, google-deepmind, deepmind, google-research, meta, facebookresearch,
         meta-llama, mistralai, nvidia, microsoft, apple, huggingface, deepseek-ai, qwen, alibaba,
         moonshotai, zai-org, bytedance-seed, allenai, amazonscience, xai-org, tencent]

enrich:                     # fetch fuller text for thin top items (robots.txt respected)
  min_text_chars: 400
  max_article_chars: 4000
  timeout_seconds: 15

llm:
  batch_size: 5             # items per summarization request (saves quota)
  max_input_chars: 2500     # per item text sent to the model
  temperature: 0.2
  retry_backoff_seconds: 8  # wait before the single retry (Retry-After wins, max 30s)
  max_5xx_strikes: 2        # 5xx/timeouts: drop a provider for the run after this many failed calls
  run_budget_seconds: 420   # stop calling LLMs after this; leftovers stay "pending"

  # Ordered fallback chain (checked 2026-11-23; free tiers change often, so run
  # `python -m collector providers` to test yours). Providers whose key env var
  # is missing are skipped, so the chain works with a single key. Several entries
  # can share one key: each Gemini model has its own free quota bucket.
  providers:
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-3.5-flash-lite
      key_env: GEMINI_API_KEY
      timeout_seconds: 90
      min_interval_seconds: 4
      notes: Google AI Studio free tier; limits shown per project in AI Studio.
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-3.6-flash
      key_env: GEMINI_API_KEY
      timeout_seconds: 90
      min_interval_seconds: 6
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-3.1-flash-lite
      key_env: GEMINI_API_KEY
      timeout_seconds: 90
      min_interval_seconds: 4
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      key_env: GROQ_API_KEY
      timeout_seconds: 60
      min_interval_seconds: 35   # free tier: 30 RPM, 1K RPD, but only 8K TPM
    - name: cerebras
      base_url: https://api.cerebras.ai/v1
      model: gpt-oss-120b
      key_env: CEREBRAS_API_KEY
      timeout_seconds: 60
      min_interval_seconds: 13   # trial: 5 RPM, 1M TPD
      notes: Free access is a $5 / 30-day trial credit, not a permanent tier.
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      model: google/gemma-4-31b-it:free
      key_env: OPENROUTER_API_KEY
      timeout_seconds: 90
      min_interval_seconds: 4
      extra_headers: {X-Title: AI Pulse}
    - name: mistral
      base_url: https://api.mistral.ai/v1
      model: mistral-small-latest
      key_env: MISTRAL_API_KEY
      timeout_seconds: 60
      min_interval_seconds: 2
    # GitHub Models was removed: its inference API was reported retired on
    # 2026-07-30 and now answers "OK" instead of JSON.
